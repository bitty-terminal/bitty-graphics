name: Release

# Pilot end-to-end component publish pipeline (CTX-0008): build the
# bitty-graphics binary per target, pack each target with the vendored
# scripts/make-component-dist.sh, and publish the version directory to R2
# under bitty/extensions/graphics/<version>/ with the immutable cache policy,
# pre-upload guard, and read-back verification mirrored from bitty's r2-mirror job
# (packaging/README.md, CTX-1063 #1792).
#
# Owner decision 2026-10-16: component name `graphics` (strip the `bitty-`
# prefix, per the `net` precedent), so the CDN keys are
# extensions/graphics/<version>/<target>.tar.gz plus the aggregate
# extensions/graphics/<version>/SHA256SUMS, installed with
# `bitty extension install graphics --version <version>`.
#
# OWNER STEP (manual, irreversible point): pushing the `v0.0.1` tag starts
# the publish. Nothing here uploads on PRs or on main pushes. The
# `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID` secrets are consumed by
# NAME only and live at the GitHub organization level; no secret value ever
# appears in this file.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Single pin for the Cloudflare Wrangler CLI used by the R2 publish job
  # (mirrors bitty's WRANGLER_VERSION).
  WRANGLER_VERSION: 4.135.0

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag, Cargo, and descriptor versions must agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "::error::ref name is not a strict version tag: $TAG" >&2
              exit 1
            }
            VERSION="${TAG#v}"
          else
            # Manual dispatch: wiring test only (publish stays tag-gated).
            VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          fi
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          DESC_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' bitty-component.toml | head -n 1)"
          [[ "$VERSION" == "$CARGO_VERSION" ]] || {
            echo "::error::version $VERSION does not match Cargo.toml $CARGO_VERSION" >&2
            exit 1
          }
          [[ "$VERSION" == "$DESC_VERSION" ]] || {
            echo "::error::version $VERSION does not match bitty-component.toml $DESC_VERSION" >&2
            exit 1
          }
          DESC_NAME="$(sed -n 's/^name = "\(.*\)"$/\1/p' bitty-component.toml | head -n 1)"
          [[ "$DESC_NAME" == "graphics" ]] || {
            echo "::error::component name must be graphics, got: $DESC_NAME" >&2
            exit 1
          }
          DESC_EXECUTABLE="$(sed -n 's/^executable = "\(.*\)"$/\1/p' bitty-component.toml | head -n 1)"
          [[ "$DESC_EXECUTABLE" == "bitty-graphics" ]] || {
            echo "::error::descriptor executable must be bitty-graphics, got: $DESC_EXECUTABLE" >&2
            exit 1
          }
          echo "release version OK: $VERSION"

  build:
    name: Build and pack ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Build and pack component tarball
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/pack-component.sh "${{ matrix.target }}" dist
          ls -la dist

      - name: Upload component artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: component-graphics-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/${{ matrix.target }}.tar.gz
            dist/${{ matrix.target }}.tar.gz.sha256

  publish:
    name: Publish to R2 (extensions/graphics)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all component artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Regenerate and verify aggregate SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          [[ "$VERSION" == "$CARGO_VERSION" ]] || {
            echo "::error::tag version $VERSION does not match Cargo.toml $CARGO_VERSION" >&2
            exit 1
          }
          DESC_EXECUTABLE="$(sed -n 's/^executable = "\(.*\)"$/\1/p' bitty-component.toml | head -n 1)"
          [[ "$DESC_EXECUTABLE" == "bitty-graphics" ]] || {
            echo "::error::descriptor executable must be bitty-graphics, got: $DESC_EXECUTABLE" >&2
            exit 1
          }
          ls -la dist
          (cd dist && sha256sum -- *.tar.gz | LC_ALL=C sort -k2 > SHA256SUMS)
          cat dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          # Per-artifact sidecars travel beside the tarballs (single-file
          # verification, mirroring make-component-dist.sh).
          (cd dist && for f in *.tar.gz; do sha256sum "$f" >"$f.sha256"; done)
          # Member contract: every tarball holds exactly bitty-component.toml
          # plus the descriptor's logical executable, with .exe on Windows.
          for f in dist/*.tar.gz; do
            ACTUAL="$(tar -tzf "$f" | LC_ALL=C sort)"
            TARGET="$(basename "$f" .tar.gz)"
            case "$TARGET" in
              *-windows-*) EXECUTABLE="${DESC_EXECUTABLE}.exe" ;;
              *) EXECUTABLE="$DESC_EXECUTABLE" ;;
            esac
            EXPECTED="$(printf '%s\n%s\n' bitty-component.toml "$EXECUTABLE" | LC_ALL=C sort)"
            [[ "$ACTUAL" == "$EXPECTED" ]] || {
              echo "::error::unexpected members in $f:" >&2
              echo "$ACTUAL" >&2
              exit 1
            }
          done
          echo "publish payload verified for graphics $VERSION"
      - name: Install Wrangler
        run: |
          set -euo pipefail
          npm install -g "wrangler@${WRANGLER_VERSION}"
          wrangler --version
      - name: Sync version directory to R2
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; cannot publish to R2" >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not set; cannot publish to R2" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          # Versioned extension objects are immutable once published. Rebuilds
          # may produce different bytes, so only skip an existing object when
          # it is byte-identical; fail closed on mismatches or unexpected reads.
          for FILE in dist/*.tar.gz dist/*.tar.gz.sha256 dist/SHA256SUMS; do
            NAME="$(basename "$FILE")"
            KEY="bitty/extensions/graphics/${VERSION}/${NAME}"
            TMP="$(mktemp)"
            ERR="${TMP}.err"
            if wrangler r2 object get "$KEY" --remote --pipe > "$TMP" 2>"$ERR"; then
              if cmp -s "$FILE" "$TMP"; then
                echo "skip ${NAME}: remote object exists with identical bytes"
                rm -f "$TMP" "$ERR"
                continue
              else
                echo "::error::R2 object ${KEY} already exists with different bytes; refusing to overwrite immutable component artifact ${NAME}" >&2
                rm -f "$TMP" "$ERR"
                exit 1
              fi
            else
              GET_STATUS=$?
              if grep -qiE 'not[ _-]?found|NoSuchKey|404|does not exist' "$ERR"; then
                echo "uploading ${NAME}: no existing object at ${KEY}"
              else
                echo "::error::failed to check existing R2 object ${KEY} (exit ${GET_STATUS}); refusing to upload blindly" >&2
                cat "$ERR" >&2 || true
                rm -f "$TMP" "$ERR"
                exit 1
              fi
            fi
            rm -f "$TMP" "$ERR"
            wrangler r2 object put "$KEY" \
              --file "$FILE" --remote \
              --cache-control "public, max-age=31536000, immutable"
          done
      - name: Verify R2 read-back hashes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          FAIL=0
          while read -r EXPECTED NAME; do
            [ -n "${EXPECTED:-}" ] || continue
            ACTUAL="$(wrangler r2 object get "bitty/extensions/graphics/${VERSION}/${NAME}" --remote --pipe | sha256sum | cut -d' ' -f1)" || ACTUAL="DOWNLOAD-FAILED"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::R2 hash mismatch for ${NAME}: expected ${EXPECTED}, got ${ACTUAL}"
              FAIL=1
            else
              echo "verified ${NAME} ${ACTUAL}"
            fi
          done < dist/SHA256SUMS
          for FILE in dist/*.tar.gz.sha256; do
            NAME="$(basename "$FILE")"
            TMP="$(mktemp)"
            ERR="${TMP}.err"
            if wrangler r2 object get "bitty/extensions/graphics/${VERSION}/${NAME}" --remote --pipe >"$TMP" 2>"$ERR"; then
              if cmp -s "$FILE" "$TMP"; then
                echo "verified ${NAME} (byte-identical)"
              else
                echo "::error::R2 content mismatch for ${NAME}"
                FAIL=1
              fi
            else
              echo "::error::failed to read back ${NAME} from R2" >&2
              cat "$ERR" >&2 || true
              FAIL=1
            fi
            rm -f "$TMP" "$ERR"
          done
          # The manifest itself travels alongside the payload and must
          # round-trip byte-identical even though it is not listed in itself.
          if wrangler r2 object get "bitty/extensions/graphics/${VERSION}/SHA256SUMS" --remote --pipe | cmp - dist/SHA256SUMS; then
            echo "verified SHA256SUMS (byte-identical)"
          else
            echo "::error::R2 content mismatch for SHA256SUMS"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "R2 read-back verification failed" >&2
            exit 1
          fi
          echo "All R2 objects verified against SHA256SUMS"
