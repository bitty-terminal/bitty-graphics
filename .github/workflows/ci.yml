name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata gates (not product evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: just check
  rust:
    name: Rust quality gates (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: RUSTFLAGS="-D warnings" cargo clippy --workspace --all-targets
      - run: cargo test --workspace --locked
  component-targets:
    name: Component release matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate descriptor, release matrix, and supported-target gate
        run: |
          set -euo pipefail
          scripts/component-release.sh check
          name="$(awk -F'"' '$1 ~ /^[[:space:]]*name[[:space:]]*=/ { print $2; exit }' bitty-component.toml)"
          version="$(awk -F'"' '$1 ~ /^[[:space:]]*version[[:space:]]*=/ { print $2; exit }' bitty-component.toml)"
          while IFS= read -r target; do
            expected="https://cdn.bitty.run/extensions/${name}/${version}/${target}.tar.gz"
            mapping="$(scripts/make-component-dist.sh --print-url --name "$name" --version "$version" --target "$target")"
            actual="${mapping%%$'\n'*}"
            test "$actual" = "$expected" || {
              echo "URL mapping drifted for $target: $actual" >&2
              exit 1
            }
          done < <(scripts/component-release.sh targets)
      - name: Emit GitHub Actions matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(scripts/component-release.sh targets --format json)"
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"
  component:
    name: Component ${{ matrix.target }}
    needs: component-targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.component-targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        shell: bash
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >>"$GITHUB_OUTPUT"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: clippy
      - name: Native compile evidence
        run: cargo check --workspace --all-targets --locked
      - name: Native test evidence
        run: cargo test --workspace --locked
      - name: Clippy on the native target (deny warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build and pack the target tarball
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '$1 ~ /^[[:space:]]*version[[:space:]]*=/ { print $2; exit }' bitty-component.toml)"
          scripts/package-component.sh \
            --version "$version" \
            --target "$TARGET" \
            --output "dist/$TARGET.tar.gz"
      - name: Protocol smoke against the packed executable
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/graphics-component"
          if command -v cygpath >/dev/null 2>&1; then
            stage="$(cygpath -u "$RUNNER_TEMP")/graphics-component"
          fi
          rm -rf "$stage"
          mkdir -p "$stage"
          tar -xzf "dist/$TARGET.tar.gz" -C "$stage"
          binary="$stage/bitty-graphics"
          case "$TARGET" in
          *-windows-*)
            binary="$binary.exe"
            chmod 755 "$binary" 2>/dev/null || true
            ;;
          esac
          smoke_binary="$binary"
          if command -v cygpath >/dev/null 2>&1; then
            smoke_binary="$(cygpath -w "$binary")"
          fi
          scripts/component-release.sh smoke --binary "$smoke_binary" --timeout 30
      - name: Emit the catalog row for this target
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/component-release.sh catalog --dist dist --output "catalog/$TARGET.catalog.v1"
          rows="$(grep -c '^extension ' "catalog/$TARGET.catalog.v1")"
          test "$rows" = "1" || {
            echo "expected exactly one catalog row, found $rows" >&2
            exit 1
          }
          grep -F " $TARGET " "catalog/$TARGET.catalog.v1"
      - name: Upload the verified target package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graphics-component-${{ matrix.target }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
  component-aggregate:
    name: Component aggregate manifest and catalog
    needs: component
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download every verified target package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: graphics-component-*
          merge-multiple: true
          path: dist
      - name: Regenerate the aggregate SHA256SUMS
        run: scripts/component-release.sh manifest --dist dist
      - name: Emit the per-target digest record (generator/verifier round-trip)
        run: scripts/component-release.sh record --dist dist --output release/component-digests.toml
      - name: Verify the complete supported matrix, descriptor chain, and digest-record round-trip
        # Note: running `record` then `verify --record` against the same `dist`
        # proves generator/verifier consistency for the release record, not an
        # independent digest pin.
        run: |
          scripts/component-release.sh verify \
            --dist dist \
            --record release/component-digests.toml
      - name: Emit the catalog.v1 row fragment
        run: scripts/component-release.sh catalog --dist dist --output catalog/catalog.v1
      - name: Show the verified catalog fragment and digest record
        run: |
          cat catalog/catalog.v1
          cat release/component-digests.toml
      - name: Upload the verified release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graphics-component-package
          path: |
            dist/
            catalog/
            release/
          retention-days: 1
          if-no-files-found: error
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
